<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>기타 튜너 &amp; 메트로놈</title>

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#12141C" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="튜너" />

<style>
  :root {
    --bg: #12141C;
    --card: #1B1E28;
    --card-2: #252935;
    --border: #313644;
    --grid: #262A36;
    --text: #F2F3F7;
    --text-dim: #8E94A6;
    --lime: #8BC53F;
    --lime-bright: #A3DC4E;
    --indigo: #6366F1;
    --amber: #F59E0B;
    --red: #EF4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    height: 100%; overscroll-behavior-y: none;
  }
  body { user-select: none; }
  #app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column;
  }
  .pad { padding-left: 14px; padding-right: 14px; }

  .tabs {
    display: flex; gap: 6px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 4px; margin: 9px 14px 10px;
  }
  .tab {
    flex: 1; padding: 9px 8px; border: none; background: transparent;
    color: var(--text-dim); font-size: 14px; font-weight: 700;
    border-radius: 10px; cursor: pointer; transition: background .18s, color .18s;
  }
  .tab.active { background: var(--indigo); color: #fff; }

  .panel { display: none; flex-direction: column; flex: 1; }
  .panel.active { display: flex; }

  /* ---------- tuner header ---------- */
  .tuner-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 7px; gap: 10px;
  }
  .tuning-name {
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    color: var(--text-dim); text-transform: uppercase;
  }
  .auto-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer;
    font-size: 13px; font-weight: 800; letter-spacing: 1px;
    color: var(--text-dim); padding: 4px 2px;
  }
  .auto-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--text-dim); background: transparent;
  }
  .auto-toggle.on { color: var(--lime); }
  .auto-toggle.on .auto-dot { border-color: var(--lime); background: var(--lime); }

  /* ---------- scope ---------- */
  .scope-wrap { position: relative; width: 100%; }
  #scope { width: 100%; display: block; }
  .edge-bar {
    position: absolute; top: 0; bottom: 0; width: 12px;
    background: #2A2F3C; transition: background .12s ease, box-shadow .12s ease;
  }
  .edge-bar.left { left: 0; }
  .edge-bar.right { right: 0; }
  .edge-bar.lit { background: var(--lime); box-shadow: 0 0 18px rgba(139,197,63,.55); }

  /* ---------- readout ---------- */
  .readout {
    display: flex; align-items: center; justify-content: center;
    gap: 18px; padding: 8px 16px 2px;
  }
  .readout .hz {
    font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--text-dim); transition: color .15s ease;
  }
  .readout .hz.ok { color: var(--lime); }
  .readout .hz small { font-size: 12px; font-weight: 600; margin-left: 3px; }
  .readout .sep { width: 1px; height: 20px; background: var(--border); }
  .readout .cents {
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--text-dim); min-width: 92px; text-align: center;
  }
  .readout .cents.ok { color: var(--lime); }
  .readout .cents.warn { color: var(--amber); }
  .readout .cents.bad { color: var(--red); }
  .status-line {
    text-align: center; font-size: 12.5px; color: var(--text-dim);
    padding: 2px 16px 7px; min-height: 18px;
  }
  .status-line b { color: var(--lime); }

  /* ---------- headstock / string picker ---------- */
  .headstock {
    display: grid; grid-template-columns: 1fr 118px 1fr;
    align-items: center; gap: 8px; padding: 0 16px 4px;
  }
  .peg-col { display: flex; flex-direction: column; gap: 7px; }
  .peg {
    height: 40px; border-radius: 11px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 17px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 6px; transition: background .15s, border-color .15s, color .15s;
  }
  .peg small { font-size: 10px; font-weight: 600; color: var(--text-dim); }
  .peg.detected { border-color: var(--lime); color: var(--lime); }
  .peg.detected small { color: var(--lime); }
  .peg.selected { background: #FFFFFF; color: #12141C; border-color: #fff; }
  .peg.selected small { color: #4B5163; }
  .peg.tuned { background: rgba(139,197,63,.18); border-color: var(--lime); color: var(--lime); }
  .peg.tuned small { color: var(--lime); }
  .neck-svg { width: 100%; height: auto; display: block; }

  /* ---------- settings ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px; margin: 0 14px 8px;
  }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .label-sm { font-size: 12.5px; color: var(--text-dim); }
  select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 7px 9px; font-size: 13.5px;
  }
  .level-row { display: flex; align-items: center; gap: 10px; }
  .level-track {
    flex: 1; height: 8px; border-radius: 4px; background: var(--card-2);
    border: 1px solid var(--border); overflow: hidden;
  }
  .level-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #5A9E1F, var(--lime));
    transition: width .07s linear;
  }
  .hint { font-size: 10px; color: var(--text-dim); margin-top: 7px; line-height: 1.4; }

  .mic-btn {
    margin: 2px 14px 0; background: linear-gradient(155deg, #6366F1, #4338CA);
    color: #fff; border: none; padding: 13px; border-radius: 15px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 24px rgba(99,102,241,.3);
  }
  .mic-btn.listening {
    background: linear-gradient(155deg, #EF4444, #991B1B);
    box-shadow: 0 10px 24px rgba(239,68,68,.28);
  }
  .mic-btn:active { transform: scale(.985); }

  .err-box {
    display: none; margin: 0 14px 10px; font-size: 12.5px; line-height: 1.55;
    color: #FCA5A5; background: rgba(239,68,68,.08);
    border: 1px solid rgba(239,68,68,.3); border-radius: 14px; padding: 12px 14px;
  }
  .err-box.show { display: block; }

  /* ---------- drum grid ---------- */
  .dgrid-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .dgrid { display: grid; gap: 2px; min-width: 100%; }
  .dlabel {
    font-size: 10px; font-weight: 700; color: var(--text-dim);
    display: flex; align-items: center; justify-content: flex-start;
    padding-right: 3px; white-space: nowrap; cursor: pointer;
  }
  .dlabel .swatch {
    width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; flex: none;
  }
  .dcell {
    height: 24px; border-radius: 4px; border: 1px solid var(--border);
    background: #22262F; cursor: pointer; padding: 0; min-width: 0;
    transition: background .08s, border-color .08s, transform .06s;
  }
  .dcell.beat-start { border-left-width: 2px; border-left-color: #454C5E; }
  .dcell.on { border-color: transparent; }
  .dcell.playhead { box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
  .dcell:active { transform: scale(.9); }
  .dhead {
    font-size: 9.5px; color: var(--text-dim); text-align: center;
    font-variant-numeric: tabular-nums; padding-bottom: 1px;
  }
  .dhead.accent { color: var(--text); font-weight: 700; }

  .preset-row { display: flex; gap: 8px; margin-top: 9px; }
  .preset-btn {
    flex: 1; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 8px 4px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .preset-btn:active { background: #2C3140; }

  .bpm-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bpm-side { display: flex; flex-direction: column; gap: 8px; }
  .bpm-side .bpm-btn { width: 56px; padding: 8px 0; }

  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .opt-label { font-size: 11px; color: var(--text-dim); }
  .opt select { width: 100%; text-align: center; }
  .tapmini {
    width: 100%; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 9px 4px;
    font-size: 13px; font-weight: 800; cursor: pointer; letter-spacing: 1px;
  }
  .tapmini:active { background: #2C3140; }

  .vol-row { display: flex; align-items: center; gap: 10px; }
  .vol-icon { font-size: 15px; flex: none; }
  .vol-range { flex: 1; margin: 0 !important; }
  .vol-val {
    font-size: 11.5px; color: var(--text-dim); width: 38px; text-align: right;
    font-variant-numeric: tabular-nums; flex: none;
  }

  .sound-note {
    font-size: 10.5px; line-height: 1.45; color: var(--text-dim);
    text-align: center; padding: 8px 20px 0;
  }
  .sound-note b { color: var(--text); }

  /* ---------- metronome ---------- */
  .bpm-display { text-align: center; padding: 2px 0 0; }
  .bpm-num { font-size: 44px; font-weight: 800; line-height: 1; }
  .bpm-unit { font-size: 13px; color: var(--text-dim); letter-spacing: 2px; margin-top: 2px; }
  .tempo-name { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; min-height: 16px; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none;
    background: transparent; margin: 6px 0 0;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--card-2); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--indigo); border: 3px solid #fff; margin-top: -10px;
    box-shadow: 0 3px 10px rgba(0,0,0,.4);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--card-2); }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: var(--indigo); border: 3px solid #fff;
  }
  .bpm-btns { display: flex; gap: 8px; }
  .bpm-btn {
    flex: 1; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 11px; padding: 9px 4px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .bpm-btn:active { background: #2C3140; }
  .beat-dots { display: flex; justify-content: center; gap: 10px; padding: 6px 0 2px; flex-wrap: wrap; }
  .beat-dot {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--card-2); border: 1px solid var(--border);
    transition: transform .06s ease, background .06s ease;
  }
  .beat-dot.accent { border-color: #4B5163; }
  .beat-dot.hit { background: var(--indigo); transform: scale(1.5); }
  .beat-dot.hit.accent { background: var(--amber); }
  .play-btn {
    margin: 2px 14px 8px; background: linear-gradient(155deg, #8BC53F, #5A9E1F);
    color: #10121A; border: none; padding: 14px; border-radius: 15px;
    font-size: 17px; font-weight: 800; cursor: pointer;
    box-shadow: 0 10px 24px rgba(139,197,63,.25);
  }
  .play-btn.playing {
    background: linear-gradient(155deg, #EF4444, #991B1B); color: #fff;
    box-shadow: 0 10px 24px rgba(239,68,68,.28);
  }
  .tap-btn {
    margin: 0 14px; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); padding: 14px; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }

  /* Short phones (iPhone SE, or any phone with browser chrome eating height):
     claw back enough vertical space that neither tab needs to scroll. */
  @media (max-height: 700px) {
    .tabs { margin: 6px 14px 7px; padding: 3px; }
    .tab { padding: 8px 8px; }
    .peg { height: 34px; }
    .peg-col { gap: 6px; }
    .hint { display: none; }
    .card { padding: 10px; margin: 0 14px 6px; }
    .mic-btn { padding: 11px; }
    .play-btn { padding: 12px; margin: 2px 14px 6px; }
    .bpm-num { font-size: 38px; }
    .dcell { height: 22px; }
    .readout { padding: 6px 16px 0; }
    .status-line { padding: 2px 16px 5px; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 22px;
    transform: translateX(-50%) translateY(10px);
    background: #2C3140; color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <div class="tabs">
    <button class="tab active" id="tab-tuner">🎸 튜너</button>
    <button class="tab" id="tab-metro">🥁 메트로놈</button>
  </div>

  <!-- ================= TUNER ================= -->
  <section class="panel active" id="panel-tuner">

    <div class="tuner-header">
      <span class="tuning-name">표준 튜닝 · EADGBE</span>
      <button class="auto-toggle on" id="auto-btn"><span class="auto-dot"></span>AUTO</button>
    </div>

    <div class="err-box" id="mic-error"></div>

    <div class="scope-wrap">
      <div class="edge-bar left" id="edge-l"></div>
      <div class="edge-bar right" id="edge-r"></div>
      <canvas id="scope"></canvas>
    </div>

    <div class="readout">
      <span class="hz" id="hz-now">--<small>Hz</small></span>
      <span class="sep"></span>
      <span class="cents" id="cents-now">-- cents</span>
    </div>
    <div class="status-line" id="status-line">마이크를 켜고 줄을 튕겨보세요</div>

    <div class="headstock">
      <div class="peg-col" id="peg-left"></div>
      <div>
        <svg class="neck-svg" viewBox="0 0 118 172" id="neck-svg"></svg>
      </div>
      <div class="peg-col" id="peg-right"></div>
    </div>

    <div class="card">
      <div class="level-row">
        <span class="label-sm" style="white-space:nowrap;">입력 감도</span>
        <div class="level-track"><div class="level-fill" id="level-fill"></div></div>
        <select id="sens-select">
          <option value="high">높음</option>
          <option value="mid" selected>보통</option>
          <option value="low">낮음</option>
        </select>
      </div>
      <div class="row-between" style="margin-top:12px;">
        <span class="label-sm">기준음 A4</span>
        <select id="a4-select">
          <option value="432">432 Hz</option>
          <option value="438">438 Hz</option>
          <option value="440" selected>440 Hz (표준)</option>
          <option value="442">442 Hz</option>
          <option value="444">444 Hz</option>
        </select>
      </div>
      <div class="hint" id="level-hint">막대가 안 움직이면 마이크가 소리를 못 받는 겁니다 — 감도를 '높음'으로 바꿔보세요.</div>
    </div>

    <button class="mic-btn" id="mic-btn">마이크 켜고 튜닝 시작</button>
  </section>

  <!-- ================= METRONOME ================= -->
  <section class="panel" id="panel-metro">

    <div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <span class="chart-title" style="font-size:12px;">드럼 패턴</span>
        <span class="chart-sub" id="grid-info">4/4 · 8비트</span>
      </div>
      <div class="dgrid-scroll">
        <div class="dgrid" id="dgrid"></div>
      </div>
      <div class="preset-row">
        <button class="preset-btn" data-preset="rock">기본 비트</button>
        <button class="preset-btn" data-preset="click">클릭만</button>
        <button class="preset-btn" data-preset="clear">지우기</button>
      </div>
    </div>

    <div class="card">
      <div class="bpm-row">
        <div class="bpm-side">
          <button class="bpm-btn" data-delta="-5">−5</button>
          <button class="bpm-btn" data-delta="-1">−1</button>
        </div>
        <div class="bpm-display">
          <div class="bpm-num" id="bpm-num">90</div>
          <div class="bpm-unit">BPM</div>
        </div>
        <div class="bpm-side">
          <button class="bpm-btn" data-delta="5">+5</button>
          <button class="bpm-btn" data-delta="1">+1</button>
        </div>
      </div>
      <div class="tempo-name" id="tempo-name"></div>
      <input type="range" id="bpm-range" min="40" max="240" value="90" step="1" />
    </div>

    <div class="card">
      <div class="vol-row">
        <span class="vol-icon">🔈</span>
        <input type="range" id="vol-range" class="vol-range" min="0" max="100" value="85" step="1" />
        <span class="vol-val" id="vol-val">85%</span>
      </div>
      <div class="opt-row" style="margin-top:10px;">
        <div class="opt">
          <span class="opt-label">박/마디</span>
          <select id="meter-select">
            <option value="2">2</option><option value="3">3</option>
            <option value="4" selected>4</option><option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>
        <div class="opt">
          <span class="opt-label">비트</span>
          <select id="sub-select">
            <option value="1">4비트</option>
            <option value="2" selected>8비트</option>
            <option value="4">16비트</option>
          </select>
        </div>
        <div class="opt">
          <span class="opt-label">탭 템포</span>
          <button class="tapmini" id="tap-btn">TAP</button>
        </div>
      </div>
    </div>

    <button class="play-btn" id="play-btn">시작</button>
    <div class="sound-note">소리가 안 들리면 아이폰 옆면의 <b>무음(벨) 스위치</b>와 볼륨을 확인하세요. 드럼 이름을 탭하면 그 소리만 따로 들어볼 수 있어요.</div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var toastEl = document.getElementById("toast");
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  var audioCtx = null;
  var audioUnlocked = false;

  // iOS mutes ordinary Web Audio when the side silent switch is on — which is
  // why sound only worked after opening the tuner (a live mic stream flips the
  // audio session and unmutes it). iOS 16.4+ lets us declare the session type
  // directly: "playback" plays through the silent switch.
  function setAudioSession(kind) {
    try {
      if (navigator.audioSession) navigator.audioSession.type = kind;
    } catch (e) {}
  }

  // Output chain. A plain gain boost would clip and sound nasty, so the
  // master gain feeds a limiter — that lets the slider push well past unity
  // (up to ~3x) while peaks stay controlled.
  var masterGain = null, limiter = null;
  var volumePct = 85;
  try {
    var savedVol = localStorage.getItem("metro.volume");
    if (savedVol !== null) volumePct = Math.max(0, Math.min(100, Number(savedVol)));
  } catch (e) {}

  // Ceiling picked by measurement, not by feel: rendered offline and compared
  // against the previous build after clamping to +/-1 like the real output.
  // 4.5x drive into the limiter = ~1.8x the old perceived loudness with
  // ~0.04% of samples clipped (inaudible).
  function volumeToGain(pct) {
    var x = Math.max(0, Math.min(100, pct)) / 100;
    return 4.5 * Math.pow(x, 1.4);       // 100% -> 4.5, 85% -> 3.6, 50% -> 1.7
  }

  function audioOut(ctx) {
    if (!ctx) return null;
    if (!masterGain || masterGain.context !== ctx) {
      masterGain = ctx.createGain();
      limiter = ctx.createDynamicsCompressor();
      limiter.threshold.setValueAtTime(-4, ctx.currentTime);
      limiter.knee.setValueAtTime(2, ctx.currentTime);
      limiter.ratio.setValueAtTime(20, ctx.currentTime);
      limiter.attack.setValueAtTime(0.001, ctx.currentTime);
      limiter.release.setValueAtTime(0.05, ctx.currentTime);
      masterGain.connect(limiter);
      limiter.connect(ctx.destination);
      masterGain.gain.value = volumeToGain(volumePct);
    }
    return masterGain;
  }

  function setVolume(pct) {
    volumePct = Math.max(0, Math.min(100, Math.round(pct)));
    if (masterGain && audioCtx) {

  function ensureAudio() {
    if (!audioCtx) {

  // resume() is ASYNC — scheduling notes right after calling it put them in
  // the past, so nothing was heard. Playing a 1-sample silent buffer inside
  // the gesture is what actually unlocks output.
  function unlockAudio() {
    var ctx = ensureAudio();
    if (!ctx) return null;
    if (!audioUnlocked) {
      try {
        var b = ctx.createBuffer(1, 1, 22050);
        var s = ctx.createBufferSource();
        s.buffer = b;
        s.connect(ctx.destination);
        s.start(0);

      } catch (e) {}

    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  // against a clock that hasn't started yet.

    var done = false;

    try {

    } catch (e) { go(); }

  // =====================================================
  // PITCH DETECTION (two-stage: decimated coarse + full-rate refine)
  // =====================================================
  var MIN_HZ = 60, MAX_HZ = 1400, DECIM = 4;
  var SENS = {
    high: { rms: 0.0008, clarity: 0.28 },
    mid:  { rms: 0.0020, clarity: 0.38 },
    low:  { rms: 0.0060, clarity: 0.50 },
  };
  var sens = SENS.mid;

  function decimate(x, D) {
    var n = Math.floor(x.length / D);
    var out = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var s = 0, base = i * D;
      for (var j = 0; j < D; j++) s += x[base + j];
      out[i] = s / D;
    }
    return out;
  }
  function nsdfAt(x, tau) {
    var n = x.length - tau;
    if (n <= 0) return 0;
    var acf = 0, m = 0;
    for (var i = 0; i < n; i++) {
      var a = x[i], b = x[i + tau];
      acf += a * b; m += a * a + b * b;
    }
    return m > 0 ? (2 * acf) / m : 0;
  }

  function detectPitch(buf, sampleRate) {
    var SIZE = buf.length;
    var sumSq = 0;
    for (var i = 0; i < SIZE; i++) sumSq += buf[i] * buf[i];
    var rms = Math.sqrt(sumSq / SIZE);
    if (rms < sens.rms) return { freq: -1, clarity: 0, rms: rms };

    var mean = 0;
    for (var i = 0; i < SIZE; i++) mean += buf[i];
    mean /= SIZE;
    var x = new Float32Array(SIZE);
    for (var i = 0; i < SIZE; i++) x[i] = buf[i] - mean;

    var xd = decimate(x, DECIM);
    var srd = sampleRate / DECIM;
    var dMin = Math.max(2, Math.floor(srd / MAX_HZ));
    var dMax = Math.min(xd.length - 2, Math.floor(srd / MIN_HZ));
    if (dMin >= dMax) return { freq: -1, clarity: 0, rms: rms };

    var nsdf = new Float32Array(dMax + 2);
    for (var tau = dMin; tau <= dMax; tau++) nsdf[tau] = nsdfAt(xd, tau);

    var globalMax = 0, peaks = [];
    for (var tau = dMin + 1; tau < dMax; tau++) {
      if (nsdf[tau] > nsdf[tau - 1] && nsdf[tau] >= nsdf[tau + 1] && nsdf[tau] > 0) {
        peaks.push(tau);
        if (nsdf[tau] > globalMax) globalMax = nsdf[tau];
      }
    }
    if (!peaks.length || globalMax <= 0) return { freq: -1, clarity: 0, rms: rms };

    // first peak clearing the threshold, not the tallest — prevents the
    // octave-down misread on the low E when the fundamental is weak
    var threshold = 0.88 * globalMax;
    var coarse = peaks[0];
    for (var p = 0; p < peaks.length; p++) {
      if (nsdf[peaks[p]] >= threshold) { coarse = peaks[p]; break; }
    }
    var clarity = nsdf[coarse];

    var center = coarse * DECIM, win = DECIM + 2;
    var lo = Math.max(2, center - win), hi = Math.min(SIZE - 2, center + win);
    if (lo >= hi) return { freq: -1, clarity: clarity, rms: rms };

    var bestTau = lo, bestVal = -2, vals = {};
    for (var tau = lo; tau <= hi; tau++) {
      var v = nsdfAt(x, tau);
      vals[tau] = v;
      if (v > bestVal) { bestVal = v; bestTau = tau; }
    }
    var yPrev = vals[bestTau - 1], yCur = vals[bestTau], yNext = vals[bestTau + 1];
    if (yPrev === undefined) yPrev = nsdfAt(x, bestTau - 1);
    if (yNext === undefined) yNext = nsdfAt(x, bestTau + 1);
    var denom = (yPrev + yNext - 2 * yCur);
    var shift = denom !== 0 ? 0.5 * (yPrev - yNext) / denom : 0;
    if (!isFinite(shift) || Math.abs(shift) > 1) shift = 0;
    var period = bestTau + shift;
    if (period <= 0) return { freq: -1, clarity: clarity, rms: rms };
    return { freq: sampleRate / period, clarity: Math.max(clarity, bestVal), rms: rms };
  }

  var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var a4Ref = 440;

  function freqToNote(freq) {

  var STRINGS = [

    { num: 5, name: "A", midi: 45 },
    { num: 4, name: "D", midi: 50 },
    { num: 3, name: "G", midi: 55 },
    { num: 2, name: "B", midi: 59 },
    { num: 1, name: "E", midi: 64 },

    for (var i = 0; i < STRINGS.length; i++) if (STRINGS[i].midi === m) return STRINGS[i];

  }
  function nearestString(midi) {

    for (var i = 0; i < STRINGS.length; i++) {

  // SCOPE  — pitch on the horizontal axis (♭ left, ♯ right),
  // time flowing downward (newest at the top).
  // =====================================================
  var canvas = document.getElementById("scope");
  var cctx = canvas.getContext("2d");
  // The scope takes whatever vertical space is left over, so the tuner fits
  // on one screen instead of forcing a scroll on shorter phones.
  var SCOPE_H = 260;

  // Measure the real laid-out chrome above and below the scope rather than
  // assuming a constant — a guessed constant was 75px off and still forced
  // a scroll on shorter phones.
  function scopeHeight() {
    var wrap = document.querySelector(".scope-wrap");
    var app = document.getElementById("app");
    var mic = document.getElementById("mic-btn");
    if (!wrap || !app || !mic) return SCOPE_H;
    var wr = wrap.getBoundingClientRect();
    if (wr.width === 0) return SCOPE_H;              // panel hidden
    var ar = app.getBoundingClientRect();
    var mr = mic.getBoundingClientRect();
    var above = wr.top - ar.top;                     // tabs + header
    var below = mr.bottom - wr.bottom;               // readout … mic button
    var avail = (window.innerHeight || 800) - above - below - 16;
    return Math.max(150, Math.min(300, Math.round(avail)));

  var samples = [];  // {t, hz, cents}

  // ---- spike rejection -------------------------------------------------
  // Two layers, because glitches come in two sizes:
  //  · a big one-frame jump (octave misread, a knock on the body) is caught
  //    by the jump gate — it only lets a large move through if it PERSISTS,
  //    which is what a real string change looks like.
  //  · small jitter is caught by a median filter. Median, not average:
  //    averaging smears a spike into its neighbours, median deletes it.
  var MEDIAN_N = 9;       // wider window = steadier reading
  var JUMP_LIMIT = 45;    // cents — anything bigger is treated as a glitch first
  var JUMP_CONFIRM = 3;   // frames a big move must persist to be believed
  var EMA = 0.14;         // lower = smoother (was 0.25); tuned so the needle
                          // stops dancing while still settling in ~0.3s

  function median(arr) {
    var s = arr.slice().sort(function (a, b) { return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  var trace = {
    hist: [], smooth: 0, init: false, jumpRun: 0,
    reset: function () { this.hist.length = 0; this.init = false; this.jumpRun = 0; },
    push: function (cents) {
      if (this.init && Math.abs(cents - this.smooth) > JUMP_LIMIT) {
        this.jumpRun++;
        if (this.jumpRun < JUMP_CONFIRM) return null;      // isolated spike → drop
        this.hist.length = 0; this.init = false; this.jumpRun = 0;  // sustained → real move
      } else this.jumpRun = 0;

      this.hist.push(cents);
      if (this.hist.length > MEDIAN_N) this.hist.shift();
      var med = median(this.hist);
      if (!this.init) { this.smooth = med; this.init = true; }
      else {
        // Adaptive smoothing: a fixed heavy filter is steady but sluggish
        // (measured 484ms to catch up). Reacting fast only when the reading is
        // genuinely far away keeps the needle rock-steady on a held note while
        // still following the peg as you turn it.
        var diff = Math.abs(med - this.smooth);
        var alpha = diff > 15 ? 0.50 : (diff > 6 ? 0.26 : EMA);
        this.smooth = this.smooth * (1 - alpha) + med * alpha;

  // persist too before we believe the player actually changed strings.

  function drawScope() {

    cctx.fillRect(0, 0, W, H);

    }

    cctx.fillStyle = "rgba(139,197,63,0.10)";

    cctx.textAlign = "right";
    cctx.fillText("♯", plotR - 6, H * 0.55);

    var curCents = fresh ? latest.cents : null;
    var inTune = curCents !== null && Math.abs(curCents) <= TOL_CENTS;

    cctx.textAlign = "center";
    cctx.textBaseline = "middle";
    cctx.font = "800 58px -apple-system, BlinkMacSystemFont, sans-serif";
    cctx.fillStyle = inTune ? "rgba(139,197,63,0.95)" : "rgba(210,215,228,0.55)";
    cctx.fillText(label, cx, H * 0.55);

      cctx.fillStyle = "#6C7386";

    var now = performance.now();
    function centsToX(c) {
      var cl = Math.max(-SPAN_CENTS, Math.min(SPAN_CENTS, c));
      return cx + (cl / SPAN_CENTS) * (plotW / 2);
    }
    function tToY(t) {
      var age = now - t;
      return plotT + (age / WINDOW_MS) * plotH;
    }

    // Collect the visible points (oldest first → bottom to top).
    // The buffer is cleared whenever the target note changes, so every
    // point here belongs to the same string: one unbroken line.
    var pts = [];
    for (var i = 0; i < samples.length; i++) {
      var s = samples[i];
      if (s.t < now - WINDOW_MS) continue;
      pts.push({ x: centsToX(s.cents), y: tToY(s.t) });
    }

    if (pts.length >= 2) {
      // Fade with age via a gradient down the time axis, so the whole
      // trace is a single continuous stroke instead of per-segment pieces.
      var grad = cctx.createLinearGradient(0, plotT, 0, plotB);
      grad.addColorStop(0, "rgba(190,214,84,1)");
      grad.addColorStop(0.55, "rgba(190,214,84,0.75)");
      grad.addColorStop(1, "rgba(190,214,84,0.12)");
      cctx.strokeStyle = grad;
      cctx.lineWidth = 2.5;
      cctx.lineJoin = "round";
      cctx.lineCap = "round";

      // Quadratic segments through the midpoints: smooth curve, no corners.
      cctx.beginPath();
      cctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length - 1; i++) {
        var xc = (pts[i].x + pts[i + 1].x) / 2;
        var yc = (pts[i].y + pts[i + 1].y) / 2;
        cctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
      }
      cctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
      cctx.stroke();
    }

    // ---- current-position bubble at the top ----
    if (fresh) {
      var bx = centsToX(curCents), by = 22;
      // tail
      cctx.beginPath();
      cctx.moveTo(bx - 6, by + 10); cctx.lineTo(bx + 6, by + 10); cctx.lineTo(bx, by + 22);
      cctx.closePath();
      cctx.fillStyle = inTune ? "#8BC53F" : "#FFFFFF";
      cctx.fill();
      // circle
      cctx.beginPath();
      cctx.arc(bx, by, 16, 0, Math.PI * 2);
      cctx.fillStyle = inTune ? "#8BC53F" : "#FFFFFF";
      cctx.fill();
      // glyph
      if (inTune) {
        cctx.strokeStyle = "#12141C"; cctx.lineWidth = 3.2;
        cctx.lineCap = "round"; cctx.lineJoin = "round";
        cctx.beginPath();
        cctx.moveTo(bx - 6.5, by + 0.5); cctx.lineTo(bx - 2, by + 5.5); cctx.lineTo(bx + 6.5, by - 5);
        cctx.stroke();
      } else {
        cctx.fillStyle = "#12141C";
        cctx.font = "800 13px -apple-system, BlinkMacSystemFont, sans-serif";
        cctx.textAlign = "center"; cctx.textBaseline = "middle";
        var v = Math.round(curCents);
        cctx.fillText((v > 0 ? "+" : "") + v, bx, by + 1);
      }
    }
  }

  function setEdges(lit) {
    if (lit) { elEdgeL.classList.add("lit"); elEdgeR.classList.add("lit"); }
    else { elEdgeL.classList.remove("lit"); elEdgeR.classList.remove("lit"); }
  }

  function resetReadout() {
    lastHzTxt = ""; lastCentsTxt = "";
    elHz.innerHTML = '--<small>Hz</small>';
    elHz.className = "hz";
    elCents.textContent = "-- cents";
    elCents.className = "cents";
    elStatusLine.textContent = listening ? "듣는 중… 줄을 튕겨보세요" : "마이크를 켜고 줄을 튕겨보세요";
    setEdges(false);
    smoothInit = false;
    renderPegs(null, false);
  }

  // =====================================================
  // mic loop
  // =====================================================
  var micStream = null, analyser = null, sourceNode = null, rafId = null, listening = false;
  var sampleBuf = null, smoothCents = 0, smoothInit = false;
  var lastGoodAt = 0, hadNote = false, levelPeak = 0;
  var lastHzTxt = "", lastCentsTxt = "";

  function updateLoop() {
    if (!listening) return;
    analyser.getFloatTimeDomainData(sampleBuf);
    var res = detectPitch(sampleBuf, audioCtx.sampleRate);

    var lvl = Math.min(1, res.rms / 0.06);
    levelPeak = Math.max(lvl, levelPeak * 0.92);
    elLevelFill.style.width = (levelPeak * 100).toFixed(1) + "%";

    var now = performance.now();
    var got = (res.freq > 0 && res.clarity > sens.clarity);
    var tMidi = null, rawCents = 0;

    if (got) {
      if (autoMode) {
        var n = freqToNote(res.freq);
        tMidi = n.midi;
        rawCents = n.cents;
      } else {
        tMidi = selectedMidi;
        rawCents = 1200 * Math.log2(res.freq / midiToFreq(selectedMidi));
        // In manual mode a wildly different note means the player is on
        // another string — that isn't a reading for this one.
        if (Math.abs(rawCents) > 350) got = false;
      }
    }

    if (got) {
      // A different note means a different axis, so the line has to restart —
      // but only once we're sure it's a real string change, not a one-frame
      // misread. Without this a single glitch erased the whole trace.
      if (targetMidi === null) {
        targetMidi = tMidi;
        clearTrace();
        pendingMidi = null; pendingRun = 0;
      } else if (tMidi !== targetMidi) {
        if (pendingMidi === tMidi) pendingRun++;
        else { pendingMidi = tMidi; pendingRun = 1; }

        if (pendingRun >= NOTE_CONFIRM) {
          diag.noteChanges.push({ from: targetMidi, to: tMidi, clarity: +res.clarity.toFixed(2), t: Math.round(now) });
          if (diag.noteChanges.length > 20) diag.noteChanges.shift();
          targetMidi = tMidi;
          clearTrace();
          pendingMidi = null; pendingRun = 0;
        } else {
          diag.notePending++;
          got = false;   // ignore this frame — don't plot it, don't reset
        }
      } else {
        pendingMidi = null; pendingRun = 0;
      }
    }

    if (got) {
      var filtered = trace.push(rawCents);   // null = rejected as a spike
      if (filtered === null) diag.spikesDropped++;
      if (filtered !== null) {
        smoothCents = filtered;
        smoothInit = true;
        lastGoodAt = now;
        hadNote = true;
      }
    }

    // Keep the readout and the line alive through short dropouts (a plucked
    // string decays below the gate long before the player stops tuning).
    var alive = smoothInit && (now - lastGoodAt) < HOLD_MS;

    if (alive) {
      var absC = Math.abs(smoothCents);
      var inTune = absC <= TOL_CENTS;
      var targetHz = midiToFreq(targetMidi);
      var shownHz = targetHz * Math.pow(2, smoothCents / 1200);

      // Only rewrite the text when the rounded value actually changes —
      // otherwise the digits flicker every frame even on a steady note.
      var hzTxt = shownHz.toFixed(1);
      if (hzTxt !== lastHzTxt) { elHz.innerHTML = hzTxt + '<small>Hz</small>'; lastHzTxt = hzTxt; }
      elHz.className = "hz" + (inTune ? " ok" : "");
      var centsInt = Math.round(smoothCents);
      var centsTxt = (centsInt > 0 ? "+" : "") + centsInt + " cents";
      if (centsTxt !== lastCentsTxt) { elCents.textContent = centsTxt; lastCentsTxt = centsTxt; }
      elCents.className = "cents " + (inTune ? "ok" : (absC <= 18 ? "warn" : "bad"));

      var st = stringByMidi(targetMidi);
      var who = st ? (st.num + "번 줄 " + st.name) : freqToNote(shownHz).name;
      if (inTune) {
        elStatusLine.innerHTML = "<b>✓ " + who + " — 맞았습니다</b>";
        if (st) tunedFlags[st.midi] = true;
      } else if (smoothCents < 0) {
        elStatusLine.textContent = "↑ " + who + " · 낮음 — 조여주세요";
      } else {
        elStatusLine.textContent = "↓ " + who + " · 높음 — 풀어주세요";
      }
      setEdges(inTune);
      renderPegs(targetMidi, inTune);

      // fixed-cadence sampling → evenly spaced points, smooth line
      if (now - lastSampleT >= SAMPLE_MS) {
        lastSampleT = now;
        pushSample(shownHz, smoothCents);
      }
    } else if (now - lastGoodAt > 2200) {
      if (hadNote) { resetReadout(); hadNote = false; }
    }

    drawScope();
    rafId = requestAnimationFrame(updateLoop);
  }

  function stopListening() {
    listening = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (sourceNode) { try { sourceNode.disconnect(); } catch (e) {} sourceNode = null; }
    if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
    elMicBtn.textContent = "마이크 켜고 튜닝 시작";
    elMicBtn.classList.remove("listening");
    elLevelFill.style.width = "0%";
    clearTrace();
    resetReadout();
    drawScope();
  }

  function showMicError(msg) { elMicErr.innerHTML = msg; elMicErr.classList.add("show"); }

  function startListening() {
    elMicErr.classList.remove("show");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMicError("<b>마이크를 쓸 수 없습니다.</b><br>이 앱은 <b>https 주소</b>로 열어야 마이크가 동작합니다. 파일을 직접 열거나 http로 접속하면 브라우저가 마이크를 차단해요.");
      return;
    }
    setAudioSession("play-and-record");
    var ctx = unlockAudio();
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      micStream = stream;
      sourceNode = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      sampleBuf = new Float32Array(analyser.fftSize);
      sourceNode.connect(analyser);
      listening = true;
      lastGoodAt = performance.now();
      elMicBtn.textContent = "튜닝 중지";
      elMicBtn.classList.add("listening");
      elStatusLine.textContent = "듣는 중… 줄을 튕겨보세요";
      resizeScope();
      updateLoop();
    }).catch(function (err) {
      var name = err && err.name ? err.name : "";
      if (name === "NotAllowedError" || name === "PermissionDeniedError") {
        showMicError("<b>마이크 권한이 거부되었습니다.</b><br>주소창의 자물쇠 아이콘 → 마이크 → 허용으로 바꾼 뒤 다시 시도해 주세요.");
      } else if (name === "NotFoundError") {
        showMicError("<b>마이크를 찾을 수 없습니다.</b>");
      } else {
        showMicError("<b>마이크를 열 수 없습니다.</b> (" + name + ")<br>https 주소로 접속했는지 확인해 주세요.");
      }
    });
  }
  elMicBtn.addEventListener("click", function () {
    if (listening) stopListening(); else startListening();
  });

  // =====================================================
  // METRONOME  —  drum-machine step sequencer
  //   rows  = 5 drum voices (they can sound together on one step)
  //   cols  = beatsPerBar x subdivision  (4비트=1, 8비트=2, 16비트=4)
  // =====================================================
  var elBpmNum = document.getElementById("bpm-num");
  var elBpmRange = document.getElementById("bpm-range");
  var elTempoName = document.getElementById("tempo-name");
  var elMeter = document.getElementById("meter-select");
  var elSub = document.getElementById("sub-select");
  var elGrid = document.getElementById("dgrid");
  var elGridInfo = document.getElementById("grid-info");
  var elPlayBtn = document.getElementById("play-btn");
  var elTapBtn = document.getElementById("tap-btn");

  // Colours validated with the dataviz palette checker against this dark
  // surface: CVD separation 10.3 and normal-vision 15.9 both clear the bar,
  // contrast passes. Each row also carries a text label, so a row is never
  // identified by colour alone.
  var DRUMS = [
    { id: "kick",  name: "킥",     color: "#F97316" },
    { id: "snare", name: "스네어", color: "#FACC15" },
    { id: "hat",   name: "하이햇", color: "#22D3EE" },
    { id: "tom",   name: "탐",     color: "#A78BFA" },
    { id: "clap",  name: "클랩",   color: "#F472B6" },
    { id: "cym",   name: "심벌",   color: "#4ADE80" },
  ];

  var bpm = 90, beatsPerBar = 4, sub = 2;
  var pattern = [];            // pattern[row][step] = 0/1
  var isPlaying = false, currentStep = 0, nextNoteTime = 0;
  var schedulerHandle = null, stepQueue = [], scheduledLog = [];
  var LOOKAHEAD_MS = 25, SCHEDULE_AHEAD = 0.12;

  function totalSteps() { return beatsPerBar * sub; }

  // ---------- drum synthesis (no samples, all generated) ----------
  var noiseBuf = null;
  function getNoise(ctx) {
    if (!noiseBuf || noiseBuf.sampleRate !== ctx.sampleRate) {
      var len = Math.floor(ctx.sampleRate * 2.0);   // long enough for a crash tail
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  function noiseVoice(ctx, t, filterType, freq, q, peak, decay) {
    var src = ctx.createBufferSource();
    src.buffer = getNoise(ctx);
    var f = ctx.createBiquadFilter();
    f.type = filterType; f.frequency.value = freq;
    if (q) f.Q.value = q;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    src.connect(f); f.connect(g); g.connect(audioOut(ctx));
    src.start(t); src.stop(t + decay + 0.03);
  }
  function toneVoice(ctx, t, type, f0, f1, peak, decay) {
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + decay * 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    osc.connect(g); g.connect(audioOut(ctx));
    osc.start(t); osc.stop(t + decay + 0.03);
  }

  function playDrum(id, t, v) {
    var ctx = audioCtx; if (!ctx) return;
    if (id === "kick") {
      toneVoice(ctx, t, "sine", 150, 45, 1.30 * v, 0.26);
    } else if (id === "snare") {
      noiseVoice(ctx, t, "highpass", 1300, 0, 0.85 * v, 0.15);
      toneVoice(ctx, t, "triangle", 195, 130, 0.50 * v, 0.11);
    } else if (id === "hat") {
      noiseVoice(ctx, t, "highpass", 7500, 0, 0.55 * v, 0.045);
    } else if (id === "tom") {
      toneVoice(ctx, t, "sine", 240, 110, 1.05 * v, 0.22);
    } else if (id === "cym") {
      // bright body + a longer, darker tail
      noiseVoice(ctx, t, "highpass", 4000, 0, 0.50 * v, 1.10);
      noiseVoice(ctx, t, "bandpass", 7200, 0.7, 0.28 * v, 1.60);
    } else if (id === "clap") {
      for (var i = 0; i < 3; i++) {
        noiseVoice(ctx, t + i * 0.013, "bandpass", 1500, 1.3, 0.60 * v, 0.055);
      }
      noiseVoice(ctx, t + 0.028, "bandpass", 1200, 1.0, 0.35 * v, 0.14);
    }
  }

  // ---------- patterns ----------
  function blankPattern() {
    var p = [];
    for (var r = 0; r < DRUMS.length; r++) {
      p[r] = [];
      for (var c = 0; c < totalSteps(); c++) p[r][c] = 0;
    }
    return p;
  }

  function applyPreset(kind) {
    pattern = blankPattern();
    var n = totalSteps();
    if (kind === "rock") {
      for (var c = 0; c < n; c++) {
        pattern[2][c] = 1;                       // hi-hat on every step
        if (c % sub === 0) {
          var beat = c / sub;
          if (beat % 2 === 0) pattern[0][c] = 1; // kick on 1 & 3
          else pattern[1][c] = 1;                // snare on 2 & 4
        }
      }
    } else if (kind === "click") {
      for (var c = 0; c < n; c++) {
        if (c % sub === 0) pattern[c === 0 ? 0 : 2][c] = 1;  // kick on 1, hat elsewhere
      }
    }
    buildGrid();
  }

  // ---------- grid ----------
  var cellEls = [];   // cellEls[row][step]

  function buildGrid() {
    var n = totalSteps();
    cellEls = [];
    elGrid.innerHTML = "";
    // 14px floor: a full bar fits on a phone at 16비트, and if the screen is
    // narrower than that the wrapper scrolls instead of clipping the last beat
    elGrid.style.gridTemplateColumns = "40px repeat(" + n + ", minmax(14px, 1fr))";

    // header row of step numbers
    var corner = document.createElement("div");
    elGrid.appendChild(corner);
    for (var c = 0; c < n; c++) {
      var h = document.createElement("div");
      h.className = "dhead" + (c % sub === 0 ? " accent" : "");
      h.textContent = (c % sub === 0) ? String(c / sub + 1) : "·";
      elGrid.appendChild(h);
    }

    for (var r = 0; r < DRUMS.length; r++) {
      var lab = document.createElement("div");
      lab.className = "dlabel";
      lab.innerHTML = '<span class="swatch" style="background:' + DRUMS[r].color + '"></span>' + DRUMS[r].name;
      (function (id) {
        lab.addEventListener("click", function () {   // tap a label to audition it
          setAudioSession("playback");
          withAudio(function (ctx) {
            if (ctx) playDrum(id, ctx.currentTime + 0.02, 1);
          });
        });
      })(DRUMS[r].id);
      elGrid.appendChild(lab);

      cellEls[r] = [];
      for (var c = 0; c < n; c++) {
        var b = document.createElement("button");
        b.className = "dcell" + (c % sub === 0 ? " beat-start" : "");
        (function (rr, cc, btn) {
          btn.addEventListener("click", function () { toggleCell(rr, cc); });
        })(r, c, b);
        elGrid.appendChild(b);
        cellEls[r][c] = b;
      }
    }
    paintGrid();
    elGridInfo.textContent = beatsPerBar + "/4 · " + (sub === 1 ? "4비트" : sub === 2 ? "8비트" : "16비트");
  }

  function paintGrid() {
    for (var r = 0; r < DRUMS.length; r++) {
      for (var c = 0; c < cellEls[r].length; c++) {
        var on = pattern[r] && pattern[r][c];
        var el = cellEls[r][c];
        if (on) { el.classList.add("on"); el.style.background = DRUMS[r].color; }
        else { el.classList.remove("on"); el.style.background = ""; }
      }
    }
  }

  function toggleCell(r, c) {
    pattern[r][c] = pattern[r][c] ? 0 : 1;
    var el = cellEls[r][c];
    if (pattern[r][c]) {
      el.classList.add("on"); el.style.background = DRUMS[r].color;
      if (!isPlaying) {
        setAudioSession("playback");
        withAudio(function (ctx) {
          if (ctx) playDrum(DRUMS[r].id, ctx.currentTime + 0.02, 0.9);
        });
      }
    } else { el.classList.remove("on"); el.style.background = ""; }
  }

  var lastHead = -1;
  function paintPlayhead(step) {
    if (lastHead === step) return;
    if (lastHead >= 0) {
      for (var r = 0; r < cellEls.length; r++) {
        if (cellEls[r][lastHead]) cellEls[r][lastHead].classList.remove("playhead");
      }
    }
    if (step >= 0) {
      for (var r2 = 0; r2 < cellEls.length; r2++) {
        if (cellEls[r2][step]) cellEls[r2][step].classList.add("playhead");
      }
    }
    lastHead = step;
  }

  // ---------- transport ----------
  function tempoName(b) {
    if (b < 60) return "Largo (매우 느리게)";
    if (b < 76) return "Adagio (느리게)";
    if (b < 108) return "Andante (걷는 속도)";
    if (b < 120) return "Moderato (보통)";
    if (b < 156) return "Allegro (빠르게)";
    if (b < 200) return "Vivace (매우 빠르게)";
    return "Presto (아주 빠르게)";
  }
  function setBpm(v) {
    bpm = Math.max(40, Math.min(240, Math.round(v)));
    elBpmNum.textContent = bpm; elBpmRange.value = bpm;
    elTempoName.textContent = tempoName(bpm);
  }
  elBpmRange.addEventListener("input", function () { setBpm(Number(elBpmRange.value)); });
  document.querySelectorAll(".bpm-btn").forEach(function (b) {
    b.addEventListener("click", function () { setBpm(bpm + Number(b.getAttribute("data-delta"))); });
  });

  function resizePattern() {
    var old = pattern, oldN = old.length ? old[0].length : 0;
    pattern = blankPattern();
    var n = totalSteps();
    // keep whatever still fits so changing 8비트 -> 16비트 doesn't wipe the work
    for (var r = 0; r < DRUMS.length; r++)
      for (var c = 0; c < Math.min(n, oldN); c++) pattern[r][c] = old[r][c];
    buildGrid();
  }

  elMeter.addEventListener("change", function () {
    beatsPerBar = Number(elMeter.value);
    currentStep = 0; lastHead = -1;
    resizePattern();
  });
  elSub.addEventListener("change", function () {
    var oldSub = sub;
    sub = Number(elSub.value);
    // remap existing hits onto the new grid so the beat is preserved
    var old = pattern, oldN = old.length ? old[0].length : 0;
    pattern = blankPattern();
    for (var r = 0; r < DRUMS.length; r++) {
      for (var c = 0; c < oldN; c++) {
        if (!old[r][c]) continue;
        var pos = (c / oldSub) * sub;            // same musical position
        var idx = Math.round(pos);
        if (idx < totalSteps()) pattern[r][idx] = 1;
      }
    }
    currentStep = 0; lastHead = -1;
    buildGrid();
  });

  document.querySelectorAll(".preset-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      applyPreset(b.getAttribute("data-preset"));
      showToast(b.textContent + " 적용");
    });
  });

  function scheduleStep(idx, t) {
    var accent = (idx === 0) ? 1.0 : (idx % sub === 0 ? 0.85 : 0.72);
    var fired = [];
    for (var r = 0; r < DRUMS.length; r++) {
      if (pattern[r] && pattern[r][idx]) { playDrum(DRUMS[r].id, t, accent); fired.push(DRUMS[r].id); }
    }
    stepQueue.push({ step: idx, time: t });
    scheduledLog.push({ step: idx, time: t, hits: fired });
    if (scheduledLog.length > 600) scheduledLog.shift();
  }
  function advanceStep() {
    nextNoteTime += (60 / bpm) / sub;
    currentStep = (currentStep + 1) % totalSteps();
  }
  function scheduler() {
    if (!audioCtx) return;
    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
      scheduleStep(currentStep, nextNoteTime);
      advanceStep();
    }
  }
  var visualRaf = null;
  function visualLoop() {
    if (!isPlaying) return;
    if (audioCtx) {
      var now = audioCtx.currentTime;
      while (stepQueue.length && stepQueue[0].time <= now) {
        paintPlayhead(stepQueue.shift().step);
      }
    }
    visualRaf = requestAnimationFrame(visualLoop);
  }
  function startMetronome() {
    // Button feedback is immediate; the transport starts once the audio
    // clock is actually running (see withAudio).
    elPlayBtn.textContent = "정지"; elPlayBtn.classList.add("playing");
    isPlaying = true;
    setAudioSession("playback");

    withAudio(function (ctx) {
      if (!ctx) {
        isPlaying = false;
        elPlayBtn.textContent = "시작"; elPlayBtn.classList.remove("playing");
        showToast("이 브라우저는 오디오를 지원하지 않아요");
        return;
      }
      if (!isPlaying) return;            // user hit stop while we were resuming
      currentStep = 0; stepQueue = []; scheduledLog = []; lastHead = -1;
      nextNoteTime = ctx.currentTime + 0.12;
      if (schedulerHandle) clearInterval(schedulerHandle);
      schedulerHandle = setInterval(scheduler, LOOKAHEAD_MS);
      scheduler(); visualLoop();
    });
  }
  function stopMetronome() {
    isPlaying = false;
    if (schedulerHandle) clearInterval(schedulerHandle);
    schedulerHandle = null;
    if (visualRaf) cancelAnimationFrame(visualRaf);
    visualRaf = null;
    stepQueue = []; paintPlayhead(-1);
    elPlayBtn.textContent = "시작"; elPlayBtn.classList.remove("playing");
  }
  elPlayBtn.addEventListener("click", function () { if (isPlaying) stopMetronome(); else startMetronome(); });

  var tapTimes = [];
  elTapBtn.addEventListener("click", function () {
    var now = performance.now();
    if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2500) tapTimes = [];
    tapTimes.push(now);
    if (tapTimes.length > 6) tapTimes.shift();
    if (tapTimes.length >= 2) {
      var iv = [];
      for (var i = 1; i < tapTimes.length; i++) iv.push(tapTimes[i] - tapTimes[i - 1]);
      var avg = iv.reduce(function (a, b) { return a + b; }, 0) / iv.length;
      var nb = 60000 / avg;
      if (nb >= 40 && nb <= 240) { setBpm(nb); showToast("템포 " + Math.round(nb) + " BPM"); }
      else showToast("범위를 벗어났어요 (40~240)");
    } else showToast("계속 탭하세요…");
  });

  var elVol = document.getElementById("vol-range");
  var elVolVal = document.getElementById("vol-val");
  elVol.value = String(volumePct);
  elVolVal.textContent = volumePct + "%";
  elVol.addEventListener("input", function () {
    var v = setVolume(Number(elVol.value));
    elVolVal.textContent = v + "%";
    elVolIcon.textContent = v === 0 ? "🔇" : (v < 40 ? "🔈" : v < 75 ? "🔉" : "🔊");
  });
  var elVolIcon = document.querySelector(".vol-icon");
  elVolIcon.textContent = volumePct === 0 ? "🔇" : (volumePct < 40 ? "🔈" : volumePct < 75 ? "🔉" : "🔊");

  window.__metro = {
    getLog: function () { return scheduledLog.slice(); },
    getVolume: function () { return volumePct; },
    // Renders a real bar through the actual audio chain offline so loudness
    // can be measured instead of guessed. Test-only.
    renderTest: function (pct, bypassChain) {
      var OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      var octx = new OC(1, Math.floor(44100 * 1.6), 44100);
      var sMg = masterGain, sLim = limiter, sCtx = audioCtx, sVol = volumePct;
      masterGain = null; limiter = null; audioCtx = octx; volumePct = pct;
      if (bypassChain) {
        // emulate the old build: voices straight to the speakers
        masterGain = octx.createGain();
        masterGain.gain.value = 1;
        masterGain.connect(octx.destination);
        limiter = null;
      }
      var S = 0.30;
      playDrum("kick", 0.05, 1.0);   playDrum("hat", 0.05, 1.0);
      playDrum("hat", 0.05 + S, 0.72);
      playDrum("snare", 0.05 + 2 * S, 0.85); playDrum("hat", 0.05 + 2 * S, 0.72);
      playDrum("hat", 0.05 + 3 * S, 0.72);
      return octx.startRendering().then(function (buf) {
        masterGain = sMg; limiter = sLim; audioCtx = sCtx; volumePct = sVol;
        var d = buf.getChannelData(0), peak = 0, sum = 0, clipped = 0;
        for (var i = 0; i < d.length; i++) {
          var v = d[i];
          if (v > 1) { v = 1; clipped++; } else if (v < -1) { v = -1; clipped++; }
          var a = v < 0 ? -v : v;
          if (a > peak) peak = a;
          sum += v * v;
        }
        return { peak: peak, rms: Math.sqrt(sum / d.length), clipped: clipped, n: d.length };
      });
    },
    setVolume: function (v) { var r = setVolume(v); elVol.value = String(r); elVolVal.textContent = r + "%"; return r; },
    volumeToGain: volumeToGain,
    isPlaying: function () { return isPlaying; },
    setBpm: setBpm, getBpm: function () { return bpm; },
    start: startMetronome, stop: stopMetronome,
    setSub: function (v) { elSub.value = String(v); elSub.dispatchEvent(new Event("change")); },
    setMeter: function (v) { elMeter.value = String(v); elMeter.dispatchEvent(new Event("change")); },
    getSub: function () { return sub; },
    getSteps: function () { return totalSteps(); },
    getPattern: function () { return pattern.map(function (r) { return r.slice(); }); },
    preset: function (k) { applyPreset(k); },
    toggle: function (r, c) { toggleCell(r, c); },
    drums: DRUMS.map(function (d) { return d.id; }),
  };

  setBpm(90);
  applyPreset("rock");
  buildPegs();
  renderPegs(null, false);
  syncAutoUI();
  resizeScope();

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && isPlaying) stopMetronome();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
