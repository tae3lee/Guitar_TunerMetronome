<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>기타 튜너 &amp; 메트로놈</title>

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#12141C" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="튜너" />

<style>
  :root {
    --bg: #12141C;
    --card: #1B1E28;
    --card-2: #252935;
    --border: #313644;
    --grid: #262A36;
    --text: #F2F3F7;
    --text-dim: #8E94A6;
    --lime: #8BC53F;
    --lime-bright: #A3DC4E;
    --indigo: #6366F1;
    --amber: #F59E0B;
    --red: #EF4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    height: 100%; overscroll-behavior-y: none;
  }
  body { user-select: none; }
  #app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column;
  }
  .pad { padding-left: 14px; padding-right: 14px; }

  .tabs {
    display: flex; gap: 6px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 5px; margin: 12px 14px;
  }
  .tab {
    flex: 1; padding: 11px 8px; border: none; background: transparent;
    color: var(--text-dim); font-size: 14px; font-weight: 700;
    border-radius: 10px; cursor: pointer; transition: background .18s, color .18s;
  }
  .tab.active { background: var(--indigo); color: #fff; }

  .panel { display: none; flex-direction: column; flex: 1; }
  .panel.active { display: flex; }

  /* ---------- tuner header ---------- */
  .tuner-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 16px 10px; gap: 10px;
  }
  .tuning-name {
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    color: var(--text-dim); text-transform: uppercase;
  }
  .auto-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer;
    font-size: 13px; font-weight: 800; letter-spacing: 1px;
    color: var(--text-dim); padding: 4px 2px;
  }
  .auto-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--text-dim); background: transparent;
  }
  .auto-toggle.on { color: var(--lime); }
  .auto-toggle.on .auto-dot { border-color: var(--lime); background: var(--lime); }

  /* ---------- scope ---------- */
  .scope-wrap { position: relative; width: 100%; }
  #scope { width: 100%; display: block; }
  .edge-bar {
    position: absolute; top: 0; bottom: 0; width: 12px;
    background: #2A2F3C; transition: background .12s ease, box-shadow .12s ease;
  }
  .edge-bar.left { left: 0; }
  .edge-bar.right { right: 0; }
  .edge-bar.lit { background: var(--lime); box-shadow: 0 0 18px rgba(139,197,63,.55); }

  /* ---------- readout ---------- */
  .readout {
    display: flex; align-items: center; justify-content: center;
    gap: 18px; padding: 12px 16px 4px;
  }
  .readout .hz {
    font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--text-dim); transition: color .15s ease;
  }
  .readout .hz.ok { color: var(--lime); }
  .readout .hz small { font-size: 12px; font-weight: 600; margin-left: 3px; }
  .readout .sep { width: 1px; height: 20px; background: var(--border); }
  .readout .cents {
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--text-dim); min-width: 92px; text-align: center;
  }
  .readout .cents.ok { color: var(--lime); }
  .readout .cents.warn { color: var(--amber); }
  .readout .cents.bad { color: var(--red); }
  .status-line {
    text-align: center; font-size: 12.5px; color: var(--text-dim);
    padding: 4px 16px 10px; min-height: 20px;
  }
  .status-line b { color: var(--lime); }

  /* ---------- headstock / string picker ---------- */
  .headstock {
    display: grid; grid-template-columns: 1fr 118px 1fr;
    align-items: center; gap: 8px; padding: 4px 16px 6px;
  }
  .peg-col { display: flex; flex-direction: column; gap: 10px; }
  .peg {
    height: 46px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 17px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 6px; transition: background .15s, border-color .15s, color .15s;
  }
  .peg small { font-size: 10px; font-weight: 600; color: var(--text-dim); }
  .peg.detected { border-color: var(--lime); color: var(--lime); }
  .peg.detected small { color: var(--lime); }
  .peg.selected { background: #FFFFFF; color: #12141C; border-color: #fff; }
  .peg.selected small { color: #4B5163; }
  .peg.tuned { background: rgba(139,197,63,.18); border-color: var(--lime); color: var(--lime); }
  .peg.tuned small { color: var(--lime); }
  .neck-svg { width: 100%; height: auto; display: block; }

  /* ---------- settings ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px; margin: 0 14px 10px;
  }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .label-sm { font-size: 12.5px; color: var(--text-dim); }
  select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 10px; font-size: 13.5px;
  }
  .level-row { display: flex; align-items: center; gap: 10px; }
  .level-track {
    flex: 1; height: 8px; border-radius: 4px; background: var(--card-2);
    border: 1px solid var(--border); overflow: hidden;
  }
  .level-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #5A9E1F, var(--lime));
    transition: width .07s linear;
  }
  .hint { font-size: 10.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }

  .mic-btn {
    margin: 4px 14px 0; background: linear-gradient(155deg, #6366F1, #4338CA);
    color: #fff; border: none; padding: 16px; border-radius: 16px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 24px rgba(99,102,241,.3);
  }
  .mic-btn.listening {
    background: linear-gradient(155deg, #EF4444, #991B1B);
    box-shadow: 0 10px 24px rgba(239,68,68,.28);
  }
  .mic-btn:active { transform: scale(.985); }

  .err-box {
    display: none; margin: 0 14px 10px; font-size: 12.5px; line-height: 1.55;
    color: #FCA5A5; background: rgba(239,68,68,.08);
    border: 1px solid rgba(239,68,68,.3); border-radius: 14px; padding: 12px 14px;
  }
  .err-box.show { display: block; }

  /* ---------- metronome ---------- */
  .bpm-display { text-align: center; padding: 8px 0 2px; }
  .bpm-num { font-size: 64px; font-weight: 800; line-height: 1; }
  .bpm-unit { font-size: 13px; color: var(--text-dim); letter-spacing: 2px; margin-top: 2px; }
  .tempo-name { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; min-height: 18px; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none;
    background: transparent; margin: 12px 0 4px;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--card-2); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--indigo); border: 3px solid #fff; margin-top: -10px;
    box-shadow: 0 3px 10px rgba(0,0,0,.4);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--card-2); }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: var(--indigo); border: 3px solid #fff;
  }
  .bpm-btns { display: flex; gap: 8px; }
  .bpm-btn {
    flex: 1; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 12px 4px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .bpm-btn:active { background: #2C3140; }
  .beat-dots { display: flex; justify-content: center; gap: 10px; padding: 6px 0 2px; flex-wrap: wrap; }
  .beat-dot {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--card-2); border: 1px solid var(--border);
    transition: transform .06s ease, background .06s ease;
  }
  .beat-dot.accent { border-color: #4B5163; }
  .beat-dot.hit { background: var(--indigo); transform: scale(1.5); }
  .beat-dot.hit.accent { background: var(--amber); }
  .play-btn {
    margin: 4px 14px 10px; background: linear-gradient(155deg, #8BC53F, #5A9E1F);
    color: #10121A; border: none; padding: 18px; border-radius: 16px;
    font-size: 17px; font-weight: 800; cursor: pointer;
    box-shadow: 0 10px 24px rgba(139,197,63,.25);
  }
  .play-btn.playing {
    background: linear-gradient(155deg, #EF4444, #991B1B); color: #fff;
    box-shadow: 0 10px 24px rgba(239,68,68,.28);
  }
  .tap-btn {
    margin: 0 14px; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); padding: 14px; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; bottom: 22px;
    transform: translateX(-50%) translateY(10px);
    background: #2C3140; color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <div class="tabs">
    <button class="tab active" id="tab-tuner">🎸 튜너</button>
    <button class="tab" id="tab-metro">🥁 메트로놈</button>
  </div>

  <!-- ================= TUNER ================= -->
  <section class="panel active" id="panel-tuner">

    <div class="tuner-header">
      <span class="tuning-name">표준 튜닝 · EADGBE</span>
      <button class="auto-toggle on" id="auto-btn"><span class="auto-dot"></span>AUTO</button>
    </div>

    <div class="err-box" id="mic-error"></div>

    <div class="scope-wrap">
      <div class="edge-bar left" id="edge-l"></div>
      <div class="edge-bar right" id="edge-r"></div>
      <canvas id="scope"></canvas>
    </div>

    <div class="readout">
      <span class="hz" id="hz-now">--<small>Hz</small></span>
      <span class="sep"></span>
      <span class="cents" id="cents-now">-- cents</span>
    </div>
    <div class="status-line" id="status-line">마이크를 켜고 줄을 튕겨보세요</div>

    <div class="headstock">
      <div class="peg-col" id="peg-left"></div>
      <div>
        <svg class="neck-svg" viewBox="0 0 118 172" id="neck-svg"></svg>
      </div>
      <div class="peg-col" id="peg-right"></div>
    </div>

    <div class="card">
      <div class="level-row">
        <span class="label-sm" style="white-space:nowrap;">입력 감도</span>
        <div class="level-track"><div class="level-fill" id="level-fill"></div></div>
        <select id="sens-select">
          <option value="high">높음</option>
          <option value="mid" selected>보통</option>
          <option value="low">낮음</option>
        </select>
      </div>
      <div class="row-between" style="margin-top:12px;">
        <span class="label-sm">기준음 A4</span>
        <select id="a4-select">
          <option value="432">432 Hz</option>
          <option value="438">438 Hz</option>
          <option value="440" selected>440 Hz (표준)</option>
          <option value="442">442 Hz</option>
          <option value="444">444 Hz</option>
        </select>
      </div>
      <div class="hint" id="level-hint">막대가 전혀 움직이지 않으면 마이크가 소리를 못 받고 있는 거예요. 감도를 '높음'으로 바꾸거나 기타를 마이크에 더 가까이 두세요.</div>
    </div>

    <button class="mic-btn" id="mic-btn">마이크 켜고 튜닝 시작</button>
  </section>

  <!-- ================= METRONOME ================= -->
  <section class="panel" id="panel-metro">
    <div class="card">
      <div class="bpm-display">
        <div class="bpm-num" id="bpm-num">90</div>
        <div class="bpm-unit">BPM</div>
        <div class="tempo-name" id="tempo-name"></div>
      </div>
      <input type="range" id="bpm-range" min="40" max="240" value="90" step="1" />
      <div class="bpm-btns">
        <button class="bpm-btn" data-delta="-5">−5</button>
        <button class="bpm-btn" data-delta="-1">−1</button>
        <button class="bpm-btn" data-delta="1">+1</button>
        <button class="bpm-btn" data-delta="5">+5</button>
      </div>
    </div>
    <div class="card">
      <div class="row-between" style="margin-bottom:12px;">
        <span class="label-sm">박자</span>
        <select id="meter-select">
          <option value="2">2/4</option><option value="3">3/4</option>
          <option value="4" selected>4/4</option><option value="6">6/8</option>
        </select>
      </div>
      <div class="row-between" style="margin-bottom:14px;">
        <span class="label-sm">소리</span>
        <select id="sound-select">
          <option value="click" selected>클릭</option>
          <option value="wood">우드블록</option>
          <option value="beep">비프</option>
        </select>
      </div>
      <div class="beat-dots" id="beat-dots"></div>
    </div>
    <button class="play-btn" id="play-btn">시작</button>
    <button class="tap-btn" id="tap-btn">탭으로 템포 맞추기</button>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var toastEl = document.getElementById("toast");
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  var tabTuner = document.getElementById("tab-tuner");
  var tabMetro = document.getElementById("tab-metro");
  var panelTuner = document.getElementById("panel-tuner");
  var panelMetro = document.getElementById("panel-metro");
  tabTuner.addEventListener("click", function () {
    tabTuner.classList.add("active"); tabMetro.classList.remove("active");
    panelTuner.classList.add("active"); panelMetro.classList.remove("active");
    resizeScope();
  });
  tabMetro.addEventListener("click", function () {
    tabMetro.classList.add("active"); tabTuner.classList.remove("active");
    panelMetro.classList.add("active"); panelTuner.classList.remove("active");
  });

  // =====================================================
  // PITCH DETECTION (two-stage: decimated coarse + full-rate refine)
  // =====================================================
  var MIN_HZ = 60, MAX_HZ = 1400, DECIM = 4;
  var SENS = {
    high: { rms: 0.0008, clarity: 0.28 },
    mid:  { rms: 0.0020, clarity: 0.38 },
    low:  { rms: 0.0060, clarity: 0.50 },
  };
  var sens = SENS.mid;

  function decimate(x, D) {
    var n = Math.floor(x.length / D);
    var out = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var s = 0, base = i * D;
      for (var j = 0; j < D; j++) s += x[base + j];
      out[i] = s / D;
    }
    return out;
  }
  function nsdfAt(x, tau) {
    var n = x.length - tau;
    if (n <= 0) return 0;
    var acf = 0, m = 0;
    for (var i = 0; i < n; i++) {
      var a = x[i], b = x[i + tau];
      acf += a * b; m += a * a + b * b;
    }
    return m > 0 ? (2 * acf) / m : 0;
  }

  function detectPitch(buf, sampleRate) {
    var SIZE = buf.length;
    var sumSq = 0;
    for (var i = 0; i < SIZE; i++) sumSq += buf[i] * buf[i];
    var rms = Math.sqrt(sumSq / SIZE);
    if (rms < sens.rms) return { freq: -1, clarity: 0, rms: rms };

    var mean = 0;
    for (var i = 0; i < SIZE; i++) mean += buf[i];
    mean /= SIZE;
    var x = new Float32Array(SIZE);
    for (var i = 0; i < SIZE; i++) x[i] = buf[i] - mean;

    var xd = decimate(x, DECIM);
    var srd = sampleRate / DECIM;
    var dMin = Math.max(2, Math.floor(srd / MAX_HZ));
    var dMax = Math.min(xd.length - 2, Math.floor(srd / MIN_HZ));
    if (dMin >= dMax) return { freq: -1, clarity: 0, rms: rms };

    var nsdf = new Float32Array(dMax + 2);
    for (var tau = dMin; tau <= dMax; tau++) nsdf[tau] = nsdfAt(xd, tau);

    var globalMax = 0, peaks = [];
    for (var tau = dMin + 1; tau < dMax; tau++) {
      if (nsdf[tau] > nsdf[tau - 1] && nsdf[tau] >= nsdf[tau + 1] && nsdf[tau] > 0) {
        peaks.push(tau);
        if (nsdf[tau] > globalMax) globalMax = nsdf[tau];
      }
    }
    if (!peaks.length || globalMax <= 0) return { freq: -1, clarity: 0, rms: rms };

    // first peak clearing the threshold, not the tallest — prevents the
    // octave-down misread on the low E when the fundamental is weak
    var threshold = 0.88 * globalMax;
    var coarse = peaks[0];
    for (var p = 0; p < peaks.length; p++) {
      if (nsdf[peaks[p]] >= threshold) { coarse = peaks[p]; break; }
    }
    var clarity = nsdf[coarse];

    var center = coarse * DECIM, win = DECIM + 2;
    var lo = Math.max(2, center - win), hi = Math.min(SIZE - 2, center + win);
    if (lo >= hi) return { freq: -1, clarity: clarity, rms: rms };

    var bestTau = lo, bestVal = -2, vals = {};
    for (var tau = lo; tau <= hi; tau++) {
      var v = nsdfAt(x, tau);
      vals[tau] = v;
      if (v > bestVal) { bestVal = v; bestTau = tau; }
    }
    var yPrev = vals[bestTau - 1], yCur = vals[bestTau], yNext = vals[bestTau + 1];
    if (yPrev === undefined) yPrev = nsdfAt(x, bestTau - 1);
    if (yNext === undefined) yNext = nsdfAt(x, bestTau + 1);
    var denom = (yPrev + yNext - 2 * yCur);
    var shift = denom !== 0 ? 0.5 * (yPrev - yNext) / denom : 0;
    if (!isFinite(shift) || Math.abs(shift) > 1) shift = 0;
    var period = bestTau + shift;
    if (period <= 0) return { freq: -1, clarity: clarity, rms: rms };
    return { freq: sampleRate / period, clarity: Math.max(clarity, bestVal), rms: rms };
  }

  var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var a4Ref = 440;
  function midiToFreq(m) { return a4Ref * Math.pow(2, (m - 69) / 12); }
  function freqToNote(freq) {
    var midi = 69 + 12 * Math.log2(freq / a4Ref);
    var rounded = Math.round(midi);
    var exact = midiToFreq(rounded);
    return {
      midi: rounded,
      name: NOTE_NAMES[((rounded % 12) + 12) % 12],
      octave: Math.floor(rounded / 12) - 1,
      cents: 1200 * Math.log2(freq / exact),
      exactFreq: exact,
    };
  }

  // strings, low -> high.  num = string number on the guitar (6 = low E)
  var STRINGS = [
    { num: 6, name: "E", midi: 40 },
    { num: 5, name: "A", midi: 45 },
    { num: 4, name: "D", midi: 50 },
    { num: 3, name: "G", midi: 55 },
    { num: 2, name: "B", midi: 59 },
    { num: 1, name: "E", midi: 64 },
  ];
  function stringByMidi(m) {
    for (var i = 0; i < STRINGS.length; i++) if (STRINGS[i].midi === m) return STRINGS[i];
    return null;
  }
  function nearestString(midi) {
    var best = null, bestDist = 1e9;
    for (var i = 0; i < STRINGS.length; i++) {
      var d = Math.abs(STRINGS[i].midi - midi);
      if (d < bestDist) { bestDist = d; best = STRINGS[i]; }
    }
    return bestDist <= 2 ? best : null;
  }

  window.__tuner = {
    detectPitch: detectPitch, freqToNote: freqToNote,
    setSens: function (k) { sens = SENS[k] || SENS.mid; },
    nearestString: nearestString,
    pushSample: function (hz, midi, cents) { pushSample(hz, midi, cents); },
    getSamples: function () { return samples.slice(); },
    drawScope: function () { drawScope(); },
    setAuto: function (v) { autoMode = v; syncAutoUI(); },
    selectString: function (m) { selectString(m); },
    getState: function () { return { autoMode: autoMode, selectedMidi: selectedMidi, targetMidi: targetMidi }; },
  };

  // =====================================================
  // TUNER UI
  // =====================================================
  var elHz = document.getElementById("hz-now");
  var elCents = document.getElementById("cents-now");
  var elStatusLine = document.getElementById("status-line");
  var elEdgeL = document.getElementById("edge-l");
  var elEdgeR = document.getElementById("edge-r");
  var elPegL = document.getElementById("peg-left");
  var elPegR = document.getElementById("peg-right");
  var elMicBtn = document.getElementById("mic-btn");
  var elMicErr = document.getElementById("mic-error");
  var elLevelFill = document.getElementById("level-fill");
  var elSens = document.getElementById("sens-select");
  var elA4 = document.getElementById("a4-select");
  var elAutoBtn = document.getElementById("auto-btn");

  var TOL_CENTS = 5;
  var SPAN_CENTS = 50;      // scope spans -50..+50 cents
  var WINDOW_MS = 8000;     // scope shows the last 8 seconds

  var autoMode = true;
  var selectedMidi = 40;    // used when AUTO is off
  var targetMidi = null;    // note the scope is currently drawn against
  var tunedFlags = {};

  // ---------- headstock pegs ----------
  // left column (top→bottom): 4D, 5A, 6E   right column: 3G, 2B, 1E
  var LEFT_ORDER = [50, 45, 40];
  var RIGHT_ORDER = [55, 59, 64];

  // Buttons are built ONCE. The update loop only toggles classes —
  // rebuilding this HTML every frame detached the buttons mid-tap and
  // made string selection unreliable.
  var pegEls = {};

  function buildPegs() {
    function build(order, container) {
      container.innerHTML = "";
      for (var i = 0; i < order.length; i++) {
        var s = stringByMidi(order[i]);
        var btn = document.createElement("button");
        btn.className = "peg";
        btn.setAttribute("data-midi", s.midi);
        btn.innerHTML = s.name + '<small>' + s.num + '번</small>';
        (function (midi) {
          btn.addEventListener("click", function () { selectString(midi); });
        })(s.midi);
        container.appendChild(btn);
        pegEls[s.midi] = btn;
      }
    }
    build(LEFT_ORDER, elPegL);
    build(RIGHT_ORDER, elPegR);
  }

  var lastPegSig = "";
  function renderPegs(detectedMidi, isInTune) {
    var sig = autoMode + "|" + selectedMidi + "|" + detectedMidi + "|" + isInTune +
              "|" + Object.keys(tunedFlags).join(",");
    if (sig === lastPegSig) return;
    lastPegSig = sig;

    for (var midi in pegEls) {
      var m = Number(midi);
      var cls = "peg";
      if (!autoMode && selectedMidi === m) cls += " selected";
      else if (detectedMidi === m && isInTune) cls += " tuned";
      else if (detectedMidi === m) cls += " detected";
      else if (tunedFlags[m]) cls += " tuned";
      if (pegEls[midi].className !== cls) pegEls[midi].className = cls;
    }
  }

  function selectString(m) {
    selectedMidi = m;
    if (autoMode) { autoMode = false; syncAutoUI(); }
    samples.length = 0;
    targetMidi = m;
    var s = stringByMidi(m);
    if (s) showToast(s.num + "번 줄 (" + s.name + ") 고정");
    renderPegs(null, false);
    drawScope();
  }

  function syncAutoUI() {
    if (autoMode) elAutoBtn.classList.add("on");
    else elAutoBtn.classList.remove("on");
  }

  elAutoBtn.addEventListener("click", function () {
    autoMode = !autoMode;
    syncAutoUI();
    samples.length = 0;
    if (autoMode) { targetMidi = null; showToast("자동 감지 — 아무 줄이나 튕기세요"); }
    else { targetMidi = selectedMidi; var s = stringByMidi(selectedMidi);
           showToast("수동 — " + (s ? s.num + "번 줄 (" + s.name + ")" : "")); }
    renderPegs(null, false);
    drawScope();
  });

  elSens.addEventListener("change", function () {
    sens = SENS[elSens.value] || SENS.mid;
    showToast("입력 감도: " + elSens.options[elSens.selectedIndex].text);
  });
  elA4.addEventListener("change", function () {
    a4Ref = Number(elA4.value);
    tunedFlags = {}; samples.length = 0;
    renderPegs(null, false); drawScope();
    showToast("기준음 A4 = " + a4Ref + " Hz");
  });

  // ---------- neck illustration ----------
  (function drawNeck() {
    var svg = document.getElementById("neck-svg");
    var W = 118, H = 172;
    var parts = [];
    // headstock body
    parts.push('<rect x="26" y="4" width="66" height="150" rx="12" fill="#3A2A1C" stroke="#4B372440" />');
    parts.push('<rect x="34" y="12" width="50" height="136" rx="9" fill="#4A3524" />');
    // nut
    parts.push('<rect x="30" y="150" width="58" height="7" rx="2" fill="#D8CDBB" />');
    // 6 strings fanning from pegs to nut
    var startXs = [40, 46, 52, 66, 72, 78];
    var endXs = [36, 44, 52, 66, 74, 82];
    for (var i = 0; i < 6; i++) {
      var w = i < 3 ? 2.2 - i * 0.35 : 0.9 + (i - 3) * 0.25;
      parts.push('<line x1="' + startXs[i] + '" y1="28" x2="' + endXs[i] + '" y2="156" stroke="#C9CDD6" stroke-width="' + (i < 3 ? 2.0 - i * 0.4 : 1.0) + '" opacity="0.85" />');
    }
    // tuning pegs
    var pegYs = [30, 66, 102];
    for (var i = 0; i < 3; i++) {
      parts.push('<circle cx="20" cy="' + pegYs[i] + '" r="8" fill="#B9BFCB" />');
      parts.push('<circle cx="20" cy="' + pegYs[i] + '" r="3.4" fill="#7E8593" />');
      parts.push('<rect x="20" y="' + (pegYs[i] - 2.5) + '" width="14" height="5" rx="2" fill="#9AA1AF" />');
      parts.push('<circle cx="98" cy="' + pegYs[i] + '" r="8" fill="#B9BFCB" />');
      parts.push('<circle cx="98" cy="' + pegYs[i] + '" r="3.4" fill="#7E8593" />');
      parts.push('<rect x="84" y="' + (pegYs[i] - 2.5) + '" width="14" height="5" rx="2" fill="#9AA1AF" />');
    }
    svg.innerHTML = parts.join("");
  })();

  // =====================================================
  // SCOPE  — pitch on the horizontal axis (♭ left, ♯ right),
  // time flowing downward (newest at the top).
  // =====================================================
  var canvas = document.getElementById("scope");
  var cctx = canvas.getContext("2d");
  var SCOPE_H = 300;
  var samples = [];  // {t, hz, midi, cents}

  function resizeScope() {
    var cssW = canvas.parentElement.clientWidth || 360;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + "px";
    canvas.style.height = SCOPE_H + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(SCOPE_H * dpr);
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawScope();
  }
  window.addEventListener("resize", resizeScope);

  function pushSample(hz, midi, cents) {
    var now = performance.now();
    samples.push({ t: now, hz: hz, midi: midi, cents: cents });
    var cutoff = now - WINDOW_MS - 400;
    while (samples.length && samples[0].t < cutoff) samples.shift();
  }

  function drawScope() {
    var W = canvas.clientWidth || 360, H = SCOPE_H;
    var padX = 18;                 // clear of the edge bars
    var plotL = padX, plotR = W - padX, plotW = plotR - plotL;
    var topPad = 40;               // room for the bubble
    var plotT = topPad, plotB = H - 10, plotH = plotB - plotT;
    var cx = plotL + plotW / 2;

    cctx.clearRect(0, 0, W, H);

    // background
    cctx.fillStyle = "#171A23";
    cctx.fillRect(0, 0, W, H);

    // ---- grid ----
    cctx.strokeStyle = "#242835";
    cctx.lineWidth = 1;
    for (var c = -SPAN_CENTS; c <= SPAN_CENTS; c += 10) {
      var gx = cx + (c / SPAN_CENTS) * (plotW / 2);
      cctx.beginPath(); cctx.moveTo(gx + .5, 0); cctx.lineTo(gx + .5, H); cctx.stroke();
    }
    for (var gy = 0; gy <= H; gy += 26) {
      cctx.beginPath(); cctx.moveTo(0, gy + .5); cctx.lineTo(W, gy + .5); cctx.stroke();
    }

    // ---- centre (in-tune) guide ----
    var tolPx = (TOL_CENTS / SPAN_CENTS) * (plotW / 2);
    cctx.fillStyle = "rgba(139,197,63,0.10)";
    cctx.fillRect(cx - tolPx, 0, tolPx * 2, H);
    cctx.strokeStyle = "rgba(139,197,63,0.55)";
    cctx.lineWidth = 1.5;
    cctx.beginPath(); cctx.moveTo(cx + .5, 0); cctx.lineTo(cx + .5, H); cctx.stroke();

    // ---- flat / sharp markers ----
    cctx.fillStyle = "#535A6B";
    cctx.font = "600 22px -apple-system, BlinkMacSystemFont, sans-serif";
    cctx.textBaseline = "middle";
    cctx.textAlign = "left";
    cctx.fillText("♭", plotL + 6, H * 0.55);
    cctx.textAlign = "right";
    cctx.fillText("♯", plotR - 6, H * 0.55);

    // ---- big note name in the centre ----
    var latest = samples.length ? samples[samples.length - 1] : null;
    var fresh = latest && (performance.now() - latest.t) < 1500;
    var curCents = fresh ? latest.cents : null;
    var inTune = curCents !== null && Math.abs(curCents) <= TOL_CENTS;

    var label = "--";
    if (targetMidi !== null) {
      var st = stringByMidi(targetMidi);
      var n = freqToNote(midiToFreq(targetMidi));
      label = st ? st.name : n.name;
    }
    cctx.textAlign = "center";
    cctx.textBaseline = "middle";
    cctx.font = "800 58px -apple-system, BlinkMacSystemFont, sans-serif";
    cctx.fillStyle = inTune ? "rgba(139,197,63,0.95)" : "rgba(210,215,228,0.55)";
    cctx.fillText(label, cx, H * 0.55);

    if (targetMidi !== null) {
      cctx.font = "600 11px -apple-system, BlinkMacSystemFont, sans-serif";
      cctx.fillStyle = "#6C7386";
      cctx.fillText(midiToFreq(targetMidi).toFixed(1) + " Hz", cx, H * 0.55 + 40);
    }

    // ---- the trace: newest at the top, flowing down ----
    var now = performance.now();
    function centsToX(c) {
      var cl = Math.max(-SPAN_CENTS, Math.min(SPAN_CENTS, c));
      return cx + (cl / SPAN_CENTS) * (plotW / 2);
    }
    function tToY(t) {
      var age = now - t;
      return plotT + (age / WINDOW_MS) * plotH;
    }

    cctx.lineWidth = 2.5;
    cctx.lineJoin = "round";
    cctx.lineCap = "round";
    var drawing = false;
    for (var i = samples.length - 1; i >= 0; i--) {
      var s = samples[i];
      if (s.t < now - WINDOW_MS) break;
      if (targetMidi !== null && s.midi !== targetMidi) {
        if (drawing) { cctx.stroke(); drawing = false; }
        continue;
      }
      var x = centsToX(s.cents), y = tToY(s.t);
      var age = (now - s.t) / WINDOW_MS;
      if (!drawing) {
        cctx.beginPath();
        cctx.strokeStyle = "rgba(190,214,84," + (1 - age * 0.75).toFixed(3) + ")";
        cctx.moveTo(x, y); drawing = true;
      } else cctx.lineTo(x, y);
    }
    if (drawing) cctx.stroke();

    // ---- current-position bubble at the top ----
    if (fresh) {
      var bx = centsToX(curCents), by = 22;
      // tail
      cctx.beginPath();
      cctx.moveTo(bx - 6, by + 10); cctx.lineTo(bx + 6, by + 10); cctx.lineTo(bx, by + 22);
      cctx.closePath();
      cctx.fillStyle = inTune ? "#8BC53F" : "#FFFFFF";
      cctx.fill();
      // circle
      cctx.beginPath();
      cctx.arc(bx, by, 16, 0, Math.PI * 2);
      cctx.fillStyle = inTune ? "#8BC53F" : "#FFFFFF";
      cctx.fill();
      // glyph
      if (inTune) {
        cctx.strokeStyle = "#12141C"; cctx.lineWidth = 3.2;
        cctx.lineCap = "round"; cctx.lineJoin = "round";
        cctx.beginPath();
        cctx.moveTo(bx - 6.5, by + 0.5); cctx.lineTo(bx - 2, by + 5.5); cctx.lineTo(bx + 6.5, by - 5);
        cctx.stroke();
      } else {
        cctx.fillStyle = "#12141C";
        cctx.font = "800 13px -apple-system, BlinkMacSystemFont, sans-serif";
        cctx.textAlign = "center"; cctx.textBaseline = "middle";
        var v = Math.round(curCents);
        cctx.fillText((v > 0 ? "+" : "") + v, bx, by + 1);
      }
    }
  }

  function setEdges(lit) {
    if (lit) { elEdgeL.classList.add("lit"); elEdgeR.classList.add("lit"); }
    else { elEdgeL.classList.remove("lit"); elEdgeR.classList.remove("lit"); }
  }

  function resetReadout() {
    elHz.innerHTML = '--<small>Hz</small>';
    elHz.className = "hz";
    elCents.textContent = "-- cents";
    elCents.className = "cents";
    elStatusLine.textContent = listening ? "듣는 중… 줄을 튕겨보세요" : "마이크를 켜고 줄을 튕겨보세요";
    setEdges(false);
    smoothInit = false;
    renderPegs(null, false);
  }

  // =====================================================
  // mic loop
  // =====================================================
  var micStream = null, analyser = null, sourceNode = null, rafId = null, listening = false;
  var sampleBuf = null, smoothCents = 0, smoothInit = false;
  var lastGoodAt = 0, hadNote = false, levelPeak = 0;

  function updateLoop() {
    if (!listening) return;
    analyser.getFloatTimeDomainData(sampleBuf);
    var res = detectPitch(sampleBuf, audioCtx.sampleRate);

    var lvl = Math.min(1, res.rms / 0.06);
    levelPeak = Math.max(lvl, levelPeak * 0.92);
    elLevelFill.style.width = (levelPeak * 100).toFixed(1) + "%";

    var now = performance.now();
    if (res.freq > 0 && res.clarity > sens.clarity) {
      var tMidi, cents;
      if (autoMode) {
        var n = freqToNote(res.freq);
        tMidi = n.midi;
        cents = n.cents;
        var near = nearestString(n.midi);
        if (near) tMidi = n.midi;
      } else {
        tMidi = selectedMidi;
        cents = 1200 * Math.log2(res.freq / midiToFreq(selectedMidi));
      }

      // In manual mode a wildly different note means the player is on
      // another string — don't pretend that's a reading for this one.
      if (!autoMode && Math.abs(cents) > 350) {
        if (now - lastGoodAt > 2200 && hadNote) { resetReadout(); hadNote = false; }
        drawScope();
        rafId = requestAnimationFrame(updateLoop);
        return;
      }

      if (targetMidi !== tMidi) { targetMidi = tMidi; smoothInit = false; }
      lastGoodAt = now; hadNote = true;

      if (!smoothInit) { smoothCents = cents; smoothInit = true; }
      else smoothCents = smoothCents * 0.7 + cents * 0.3;

      var absC = Math.abs(smoothCents);
      var inTune = absC <= TOL_CENTS;

      elHz.innerHTML = res.freq.toFixed(1) + '<small>Hz</small>';
      elHz.className = "hz" + (inTune ? " ok" : "");
      var sign = smoothCents > 0 ? "+" : "";
      elCents.textContent = sign + smoothCents.toFixed(0) + " cents";
      elCents.className = "cents " + (inTune ? "ok" : (absC <= 18 ? "warn" : "bad"));

      var st = stringByMidi(targetMidi);
      var who = st ? (st.num + "번 줄 " + st.name) : freqToNote(res.freq).name;
      if (inTune) {
        elStatusLine.innerHTML = "<b>✓ " + who + " — 맞았습니다</b>";
        if (st) tunedFlags[st.midi] = true;
      } else if (smoothCents < 0) {
        elStatusLine.textContent = "↑ " + who + " · 낮음 — 조여주세요";
      } else {
        elStatusLine.textContent = "↓ " + who + " · 높음 — 풀어주세요";
      }

      setEdges(inTune);
      pushSample(res.freq, targetMidi, cents);
      renderPegs(targetMidi, inTune);

    } else if (now - lastGoodAt > 2200) {
      if (hadNote) { resetReadout(); hadNote = false; }
    }

    drawScope();
    rafId = requestAnimationFrame(updateLoop);
  }

  function stopListening() {
    listening = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (sourceNode) { try { sourceNode.disconnect(); } catch (e) {} sourceNode = null; }
    if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
    elMicBtn.textContent = "마이크 켜고 튜닝 시작";
    elMicBtn.classList.remove("listening");
    elLevelFill.style.width = "0%";
    samples.length = 0;
    resetReadout();
    drawScope();
  }

  function showMicError(msg) { elMicErr.innerHTML = msg; elMicErr.classList.add("show"); }

  function startListening() {
    elMicErr.classList.remove("show");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMicError("<b>마이크를 쓸 수 없습니다.</b><br>이 앱은 <b>https 주소</b>로 열어야 마이크가 동작합니다. 파일을 직접 열거나 http로 접속하면 브라우저가 마이크를 차단해요.");
      return;
    }
    var ctx = ensureAudio();
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      micStream = stream;
      sourceNode = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      sampleBuf = new Float32Array(analyser.fftSize);
      sourceNode.connect(analyser);
      listening = true;
      lastGoodAt = performance.now();
      elMicBtn.textContent = "튜닝 중지";
      elMicBtn.classList.add("listening");
      elStatusLine.textContent = "듣는 중… 줄을 튕겨보세요";
      resizeScope();
      updateLoop();
    }).catch(function (err) {
      var name = err && err.name ? err.name : "";
      if (name === "NotAllowedError" || name === "PermissionDeniedError") {
        showMicError("<b>마이크 권한이 거부되었습니다.</b><br>주소창의 자물쇠 아이콘 → 마이크 → 허용으로 바꾼 뒤 다시 시도해 주세요.");
      } else if (name === "NotFoundError") {
        showMicError("<b>마이크를 찾을 수 없습니다.</b>");
      } else {
        showMicError("<b>마이크를 열 수 없습니다.</b> (" + name + ")<br>https 주소로 접속했는지 확인해 주세요.");
      }
    });
  }
  elMicBtn.addEventListener("click", function () {
    if (listening) stopListening(); else startListening();
  });

  // =====================================================
  // METRONOME
  // =====================================================
  var elBpmNum = document.getElementById("bpm-num");
  var elBpmRange = document.getElementById("bpm-range");
  var elTempoName = document.getElementById("tempo-name");
  var elMeter = document.getElementById("meter-select");
  var elSound = document.getElementById("sound-select");
  var elBeatDots = document.getElementById("beat-dots");
  var elPlayBtn = document.getElementById("play-btn");
  var elTapBtn = document.getElementById("tap-btn");

  var bpm = 90, beatsPerBar = 4, soundType = "click";
  var isPlaying = false, currentBeat = 0, nextNoteTime = 0;
  var schedulerHandle = null, beatQueue = [], scheduledLog = [];
  var LOOKAHEAD_MS = 25, SCHEDULE_AHEAD = 0.12;

  function tempoName(b) {
    if (b < 60) return "Largo (매우 느리게)";
    if (b < 76) return "Adagio (느리게)";
    if (b < 108) return "Andante (걷는 속도)";
    if (b < 120) return "Moderato (보통)";
    if (b < 156) return "Allegro (빠르게)";
    if (b < 200) return "Vivace (매우 빠르게)";
    return "Presto (아주 빠르게)";
  }
  function renderBeatDots(activeIdx) {
    var html = "";
    for (var i = 0; i < beatsPerBar; i++)
      html += '<div class="beat-dot' + (i === 0 ? " accent" : "") + (i === activeIdx ? " hit" : "") + '"></div>';
    elBeatDots.innerHTML = html;
  }
  function setBpm(v) {
    bpm = Math.max(40, Math.min(240, Math.round(v)));
    elBpmNum.textContent = bpm; elBpmRange.value = bpm;
    elTempoName.textContent = tempoName(bpm);
  }
  elBpmRange.addEventListener("input", function () { setBpm(Number(elBpmRange.value)); });
  document.querySelectorAll(".bpm-btn").forEach(function (b) {
    b.addEventListener("click", function () { setBpm(bpm + Number(b.getAttribute("data-delta"))); });
  });
  elMeter.addEventListener("change", function () {
    beatsPerBar = Number(elMeter.value); currentBeat = 0; renderBeatDots(-1);
  });
  elSound.addEventListener("change", function () { soundType = elSound.value; });

  function scheduleClick(beatIndex, time) {
    var ctx = audioCtx; if (!ctx) return;
    var isAccent = (beatIndex === 0);
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    var freq, dur, type;
    if (soundType === "wood") { type = "triangle"; freq = isAccent ? 1600 : 1100; dur = .035; }
    else if (soundType === "beep") { type = "sine"; freq = isAccent ? 1200 : 800; dur = .06; }
    else { type = "square"; freq = isAccent ? 2000 : 1400; dur = .022; }
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(.0001, time);
    gain.gain.exponentialRampToValueAtTime(isAccent ? .55 : .32, time + .002);
    gain.gain.exponentialRampToValueAtTime(.0001, time + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(time); osc.stop(time + dur + .02);
    beatQueue.push({ beat: beatIndex, time: time });
    scheduledLog.push({ beat: beatIndex, time: time });
    if (scheduledLog.length > 400) scheduledLog.shift();
  }
  function advanceNote() { nextNoteTime += 60 / bpm; currentBeat = (currentBeat + 1) % beatsPerBar; }
  function scheduler() {
    if (!audioCtx) return;
    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) { scheduleClick(currentBeat, nextNoteTime); advanceNote(); }
  }
  var visualRaf = null;
  function visualLoop() {
    if (!isPlaying) return;
    if (audioCtx) {
      var now = audioCtx.currentTime;
      while (beatQueue.length && beatQueue[0].time <= now) {
        var b = beatQueue.shift();
        renderBeatDots(b.beat);
        setTimeout(function () { renderBeatDots(-1); }, 90);
      }
    }
    visualRaf = requestAnimationFrame(visualLoop);
  }
  function startMetronome() {
    var ctx = ensureAudio();
    if (!ctx) { showToast("이 브라우저는 오디오를 지원하지 않아요"); return; }
    isPlaying = true; currentBeat = 0; beatQueue = []; scheduledLog = [];
    nextNoteTime = ctx.currentTime + .08;
    schedulerHandle = setInterval(scheduler, LOOKAHEAD_MS);
    scheduler(); visualLoop();
    elPlayBtn.textContent = "정지"; elPlayBtn.classList.add("playing");
  }
  function stopMetronome() {
    isPlaying = false;
    if (schedulerHandle) clearInterval(schedulerHandle);
    schedulerHandle = null;
    if (visualRaf) cancelAnimationFrame(visualRaf);
    visualRaf = null;
    beatQueue = []; renderBeatDots(-1);
    elPlayBtn.textContent = "시작"; elPlayBtn.classList.remove("playing");
  }
  elPlayBtn.addEventListener("click", function () { if (isPlaying) stopMetronome(); else startMetronome(); });

  var tapTimes = [];
  elTapBtn.addEventListener("click", function () {
    var now = performance.now();
    if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2500) tapTimes = [];
    tapTimes.push(now);
    if (tapTimes.length > 6) tapTimes.shift();
    if (tapTimes.length >= 2) {
      var iv = [];
      for (var i = 1; i < tapTimes.length; i++) iv.push(tapTimes[i] - tapTimes[i - 1]);
      var avg = iv.reduce(function (a, b) { return a + b; }, 0) / iv.length;
      var nb = 60000 / avg;
      if (nb >= 40 && nb <= 240) { setBpm(nb); showToast("템포 " + Math.round(nb) + " BPM"); }
      else showToast("범위를 벗어났어요 (40~240)");
    } else showToast("계속 탭하세요…");
  });

  window.__metro = {
    getLog: function () { return scheduledLog.slice(); },
    isPlaying: function () { return isPlaying; },
    setBpm: setBpm, getBpm: function () { return bpm; },
    start: startMetronome, stop: stopMetronome,
  };

  setBpm(90);
  renderBeatDots(-1);
  buildPegs();
  renderPegs(null, false);
  syncAutoUI();
  resizeScope();

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && isPlaying) stopMetronome();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
